<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FMAC — تفريغ البيانات</title>
<style>
:root{--brand:#3B9DFF;--ok:#21C77A;--warn:#F2A93B;--bad:#EF4D5A;--steel:#93A7BA}
*{box-sizing:border-box}
body{background:#050B14;color:#F4F8FC;font:14px/1.7 Tajawal,'Segoe UI',system-ui,sans-serif;
  padding:22px;max-width:900px;margin:0 auto;direction:rtl}
h1{font-size:20px;margin:0 0 4px}
p.sub{color:var(--steel);font-size:12.5px;margin:0 0 6px}
.card{background:#0D1A29;border:1px solid #20364C;border-radius:16px;padding:18px;margin:14px 0}
.danger{border-color:#EF4D5A55;background:#1a1012}
h3{font-size:15px;margin:0 0 10px}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{text-align:right;padding:7px 8px;border-bottom:1px solid #17283A}
th{color:var(--steel);font-size:11.5px;font-weight:600}
td.n{direction:ltr;text-align:left;font-variant-numeric:tabular-nums}
button{background:var(--brand);color:#fff;border:0;border-radius:10px;padding:10px 18px;
  font:700 14px inherit;cursor:pointer}
button.ghost{background:#112235;color:#F4F8FC;border:1px solid #20364C;font-weight:400;
  padding:6px 12px;font-size:12.5px}
button:disabled{opacity:.45;cursor:default}
input[type=text]{background:#112235;color:#F4F8FC;border:1px solid #20364C;border-radius:10px;
  padding:9px 12px;font:14px inherit;width:190px}
.grp{margin:10px 0 4px;color:var(--steel);font-size:12px;font-weight:700}
.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
#log{font:12px/1.6 ui-monospace,monospace;max-height:300px;overflow:auto;white-space:pre-wrap}
label{cursor:pointer}
</style></head><body>

<h1>تفريغ البيانات</h1>
<p class="sub">للإدارة وحدها. الحذف نهائي ولا يمكن التراجع عنه.</p>

<div class="card" id="authCard">جارٍ التحقّق…</div>

<div id="app" hidden>
  <div class="card">
    <h3>اختر ما تريد حذفه</h3>
    <p class="sub">الأعداد محسوبة الآن من قاعدة البيانات. المجموعات الفارغة معطَّلة.</p>
    <div class="row" style="margin:10px 0">
      <button class="ghost" data-pick="plans">خطط المدربين وما يتبعها</button>
      <button class="ghost" data-pick="season">نتائج الموسم</button>
      <button class="ghost" data-pick="none">إلغاء الاختيار</button>
    </div>
    <div id="list">جارٍ العدّ…</div>
  </div>

  <div class="card danger">
    <h3 class="bad">تأكيد الحذف</h3>
    <p class="sub" id="summary">لم تختر شيئاً.</p>
    <p class="sub">اكتب <b>امسح</b> في الخانة ثم اضغط الزر.</p>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <input type="text" id="confirm" autocomplete="off" placeholder="امسح">
      <button id="go" disabled>احذف نهائياً</button>
      <span id="msg" class="sub"></span>
    </div>
  </div>

  <div class="card" id="logCard" hidden><h3>التنفيذ</h3><div id="log"></div></div>
</div>

<script type="module">
import { ready, PROFILE, db } from './js/fmac-auth.js';
import { COL } from './js/fmac-config.js';
import { collection, getDocs, doc, writeBatch } from './vendor/firebase-firestore.js';

const $ = (id) => document.getElementById(id);

/* المجموعات مجمّعة كما يفهمها المستخدم، لا كما تُخزَّن */
const GROUPS = [
  { key: 'plans', title: 'خطط المدربين وما يتبعها', cols: [
    [COL.plans, 'الخطط'], [COL.items, 'بنود الخطط'], [COL.subs, 'سجل التسليم'],
    [COL.versions, 'نسخ الخطط'], [COL.stages, 'دورة الخطة'],
    [COL.ticks, 'سجل التقييم (الرصد)'], [COL.cancels, 'سجل الإلغاء'],
    [COL.attend, 'سجل الحضور'], [COL.replies, 'ردود المدربين'],
    [COL.segs, 'زمن الأجزاء'], [COL.devs, 'سجل الانحراف'],
    [COL.sess, 'بصمة الحصص'], [COL.notes, 'الملاحظات الفنية'],
    [COL.acts, 'حالة المهام'], [COL.weeks, 'إغلاق الأسابيع'],
    [COL.monthly, 'الخطط الشهرية'], [COL.reviews, 'تقييمات الخطط الشهرية'],
    [COL.fitness, 'الخطط البدنية'], [COL.fitnotes, 'ملاحظات الخطط البدنية'],
  ] },
  { key: 'season', title: 'نتائج المواسم', cols: [
    [COL.results, 'نتائج البطولات'], [COL.shields, 'دروع المواسم'],
    [COL.camps, 'معسكرات المواسم'], [COL.national, 'لاعبو المنتخب'],
  ] },
  { key: 'other', title: 'أخرى', cols: [
    [COL.agenda, 'أجندة القسم'], [COL.visits, 'الزيارات الفنية'],
    [COL.calendar, 'كالندر الموسم'], [COL.audit, 'سجل التدقيق'],
  ] },
];

const me = await ready();
if (!me.admin) {
  $('authCard').innerHTML = '<span class="bad">هذا الحساب ليس حساب إدارة.</span>';
} else {
  $('authCard').innerHTML = 'الدخول: <b>' + (me.name || me.email) + '</b> · إدارة ✓';
  $('app').hidden = false;
  await build();
}

const counts = {};
async function build() {
  let html = '';
  for (const g of GROUPS) {
    html += '<div class="grp">' + g.title + '</div><table>';
    for (const [col, label] of g.cols) {
      let n = 0;
      try { n = (await getDocs(collection(db, col))).size; } catch (e) { n = -1; }
      counts[col] = n;
      const dis = n <= 0 ? ' disabled' : '';
      html += '<tr><td><label><input type="checkbox" data-col="' + col +
        '" data-grp="' + g.key + '"' + dis + '> ' + label + '</label></td>' +
        '<td class="n">' + (n < 0 ? '—' : n) + '</td>' +
        '<td class="n" style="color:#93A7BA">' + col + '</td></tr>';
    }
    html += '</table>';
  }
  /* المستخدمون خارج القائمة عمداً — حذفهم يمنع الدخول */
  html += '<p class="sub" style="margin-top:14px">مجموعة <b>users</b> ' +
    '(' + ((await getDocs(collection(db, COL.users))).size) + ' حساباً) ليست في القائمة ' +
    'عمداً — حذفها يمنع الدخول. تُدار من صفحة الحسابات.</p>';
  $('list').innerHTML = html;
  $('list').addEventListener('change', refresh);
  refresh();
}

const picked = () => [...document.querySelectorAll('#list input:checked')]
  .map((e) => e.dataset.col);

function refresh() {
  const p = picked();
  const total = p.reduce((s, c) => s + (counts[c] || 0), 0);
  $('summary').innerHTML = p.length
    ? ('سيُحذف <b class="bad">' + total + '</b> وثيقة من <b>' + p.length + '</b> مجموعة.')
    : 'لم تختر شيئاً.';
  $('go').disabled = !(p.length && $('confirm').value.trim() === 'امسح');
}
$('confirm').addEventListener('input', refresh);

for (const b of document.querySelectorAll('[data-pick]')) {
  b.addEventListener('click', () => {
    const k = b.dataset.pick;
    for (const el of document.querySelectorAll('#list input')) {
      if (el.disabled) continue;
      el.checked = (k === 'none') ? false : (el.dataset.grp === k);
    }
    refresh();
  });
}

$('go').addEventListener('click', async () => {
  const cols = picked();
  if (!cols.length) return;
  $('go').disabled = true;
  $('logCard').hidden = false;
  const log = (m, cls) => {
    const d = document.createElement('div');
    if (cls) d.className = cls;
    d.textContent = m;
    $('log').appendChild(d);
    $('log').scrollTop = $('log').scrollHeight;
  };
  let done = 0, failed = 0;
  for (const col of cols) {
    let ids = [];
    try { (await getDocs(collection(db, col))).forEach((d) => ids.push(d.id)); }
    catch (e) { log('✗ ' + col + ' — تعذّرت القراءة: ' + e.message, 'bad'); failed++; continue; }
    log('▸ ' + col + ' — ' + ids.length + ' وثيقة');
    for (let i = 0; i < ids.length; i += 400) {
      const slice = ids.slice(i, i + 400);
      const b = writeBatch(db);
      for (const id of slice) b.delete(doc(db, col, id));
      try { await b.commit(); done += slice.length; log('   ✓ حُذف ' + slice.length, 'ok'); }
      catch (e) { failed += slice.length; log('   ✗ ' + e.message, 'bad'); }
    }
  }
  log('');
  log('انتهى — حُذف ' + done + (failed ? ('، وفشل ' + failed) : ''), failed ? 'bad' : 'ok');
  log('حدّث الموقع لترى النتيجة.', 'ok');
  $('confirm').value = '';
  await build();
});
</script></body></html>
