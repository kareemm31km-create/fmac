<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>FMAC monthly test</title>
<style>body{background:#08090c;color:#e9ecf1;font:13.5px/1.75 ui-monospace,monospace;padding:20px}
.ok{color:#22c07f}.bad{color:#ff4d59}.warn{color:#ffc233}
h2{font-size:14px;margin:20px 0 6px;color:#5b8def;font-weight:700}
#sum{margin:16px 0;padding:12px 14px;border-radius:12px;background:#0f1115;border:1px solid #23272f;font-size:15px}</style>
</head><body>
<h1 style="font-size:17px">FMAC — فحص الخطط الشهرية</h1>
<div id="sum">running…</div><div id="out"></div>
<script type="module">
import { readXlsx } from './js/fmac-xlsx.js?v=8';
import * as M from './js/fmac-monthly.js?v=8';
import * as CP from './js/fmac-coachplan.js?v=8';

const out = []; let pass = 0, fail = 0;
const head = (t) => out.push('<h2>' + t + '</h2>');
const eq = (label, got, want) => {
  const g = JSON.stringify(got), w = JSON.stringify(want);
  if (g === w) { pass++; out.push('<div class="ok">PASS  ' + label + '  = ' + g + '</div>'); }
  else { fail++; out.push('<div class="bad">FAIL  ' + label + '<br>   got:  ' + g + '<br>   want: ' + w + '</div>'); }
};
const truthy = (label, v) => {
  if (v) { pass++; out.push('<div class="ok">PASS  ' + label + '</div>'); }
  else { fail++; out.push('<div class="bad">FAIL  ' + label + '</div>'); }
};

/* ── 1. الـrubric ── */
head('[1] الـrubric — مطابقة ملف آلية التقييم');
eq('عدد المحاور', M.RUBRIC.length, 8);
eq('مجموع الأوزان', Math.round(M.RUBRIC.reduce((s, a) => s + a.weight, 0) * 100) / 100, 1);
eq('وزن تقنين الحمل (الأعلى)', M.RUBRIC.find((a) => a.n === 3).weight, 0.2);
eq('وزن التوثيق (الأدنى)', M.RUBRIC.find((a) => a.n === 8).weight, 0.05);
eq('تقدير 95', M.gradeOf(95).grade, 'متميز');
eq('تقدير 85', M.gradeOf(85).grade, 'جيد جداً');
eq('تقدير 75', M.gradeOf(75).grade, 'جيد');
eq('تقدير 65', M.gradeOf(65).grade, 'مقبول');
eq('تقدير 59', M.gradeOf(59).grade, 'يحتاج تطوير');
eq('قرار 65', M.gradeOf(65).decision, 'إعادة ضبط جزئي');
eq('أولوية 55', M.priorityOf(55), 'عالية');
eq('أولوية 70', M.priorityOf(70), 'متوسطة');
eq('أولوية 85', M.priorityOf(85), 'منخفضة');

/* ── 2. الموعد النهائي ── */
head('[2] الموعد النهائي — آخر يوم في الشهر السابق ناقص يوم');
eq('«سبتمبر 2026» ⇒ مفتاح', M.monthKey('سبتمبر 2026'), '2026-09');
eq('من مسمّى أسبوع', M.monthOfWeek('الأسبوع 2 — سبتمبر 2026'), '2026-09');
eq('مفتاح ⇒ مسمّى', M.monthLabel('2026-09'), 'سبتمبر 2026');
eq('خطة سبتمبر ⇒ 30 أغسطس', M.dueLabel('2026-09'), '30 أغسطس 2026');
eq('خطة مارس ⇒ 27 فبراير (28 يوماً)', M.dueLabel('2027-03'), '27 فبراير 2027');
eq('خطة مارس 2028 ⇒ 28 فبراير (كبيسة)', M.dueLabel('2028-03'), '28 فبراير 2028');
eq('خطة يناير ⇒ 30 ديسمبر (عبور السنة)', M.dueLabel('2027-01'), '30 ديسمبر 2026');
eq('رفع 30 أغسطس ⇒ في الموعد', M.lateness('2026-09', '2026-08-30T10:00:00Z').state, 'في الموعد');
eq('رفع 31 أغسطس ⇒ متأخرة', M.lateness('2026-09', '2026-08-31T10:00:00Z').state, 'متأخرة');
eq('تأخير يومين', M.lateness('2026-09', '2026-09-01T10:00:00Z').days, 2);

/* ── 3. توحيد مقياس الشدة ── */
head('[3] الشدة — كسر أو RPE');
eq('«80–94%» مدى ⇒ وسطه 8.7', CP.parseIntensity('80–94%'), 8.7);
eq('«85%» نسبة ⇒ 8.5', CP.parseIntensity('85%'), 8.5);
eq('«0.65» كسر ⇒ 6.5', CP.parseIntensity('0.65'), 6.5);
eq('«7» RPE ⇒ 7', CP.parseIntensity('7'), 7);
eq('ضوضاء إكسل 0.55000000000000004 ⇒ 5.5',
   CP.parseIntensity(0.55000000000000004), 5.5);
eq('نصّ بلا رقم ⇒ NaN', Number.isNaN(CP.parseIntensity('متوسط')), true);
eq('«5,000م» ⇒ رقمي 5000', CP.parseVolume('5,000م'), { kind: 'رقمي', value: 5000 });
eq('«4×50» ⇒ رقمي', CP.parseVolume('4×50').kind, 'رقمي');
eq('«متوسط» ⇒ وصفي', CP.parseVolume('متوسط').kind, 'وصفي');
eq('فارغ ⇒ بلا نوع', CP.parseVolume('').kind, '');
eq('أرقام مع فاصل آلاف', CP.numbersIn('5,000م'), [5000]);
eq('أرقام المدى', CP.numbersIn('80–94%'), [80, 94]);
eq('اسم ورقة أسبوع', CP.isWeekSheet('اسبوع 3'), true);
eq('ورقة غير أسبوعية', CP.isWeekSheet('بيانات الخطة'), false);

/* ── 4. النموذج المعتمد الفارغ ── */
head('[4] النموذج المعتمد — نسخة فارغة');
const bufT = await (await fetch('./templates/FMAC-نموذج-الخطة-الشهرية.xlsx?v=3')).arrayBuffer();
const rT = await CP.evaluateCoachFile(bufT, readXlsx);
truthy('قُرئ بلا خطأ', rT.ok);
if (rT.ok) {
  eq('أربع أوراق أسابيع', rT.plan.weeks.length, 4);
  eq('ورقة بيانات الخطة موجودة', rT.plan.hasHeaderSheet, true);
  eq('ورقة المؤشرات موجودة', rT.plan.hasKpiSheet, true);
  eq('لا أيام تدريب في النسخة الفارغة', rT.result.activeDays, 0);
  const ax = (n) => rT.result.axes.find((a) => a.n === n);
  eq('محور 3 غير قابل للقياس', ax(3).score, null);
  eq('محور 5 غير قابل للقياس', ax(5).score, null);
  eq('محور 6 صفر — الورقة موجودة لكنها فارغة', ax(6).score, 0);
  truthy('محور 7 مقيس (الورقة موجودة)', ax(7).score !== null);
}

/* ── 5. خطة حقيقية بالنموذج قبل التوسيع ── */
head('[5] خطة مصارعة حقيقية — النموذج قبل التوسيع');
const bufW = await (await fetch('./_fixtures/coach-plan-filled.xlsx?v=3')).arrayBuffer();
const rW = await CP.evaluateCoachFile(bufW, readXlsx);
truthy('قُرئت بلا خطأ', rW.ok);
if (rW.ok) {
  const R = rW.result, ax = (n) => R.axes.find((a) => a.n === n);
  eq('أربعة أسابيع', R.weeks, 4);
  eq('24 يوم تدريب', R.activeDays, 24);
  eq('المرحلة مقروءة', rW.plan.weeks[0].phase, 'الاعداد');
  eq('رقم الأسبوع التدريبي', rW.plan.weeks[0].trainingWeek, '32');
  eq('20 هدفاً عبر الأسابيع',
     rW.plan.weeks.reduce((s, w) => s + w.objectives.length, 0), 20);
  eq('الشدة 0.65 موحَّدة إلى 6.5', rW.plan.weeks[0].days[0].rpe, 6.5);
  eq('محور 5 = 100 (كل الأيام لها الأجزاء الثلاثة)', ax(5).score, 100);
  /* الموجة داخل الأسبوع تامّة (انتشار 27–36٪) والانتشار بين الأسابيع 13٪ */
  eq('محور 2 = 96 (يرى الموجة داخل الأسبوع)', ax(2).score, 96);
  /* «4×50» صارت حجماً رقمياً بعد إصلاح القارئ */
  eq('محور 3 = 59 (الحجم «4×50» رقمي)', ax(3).score, 59);
  truthy('الدليل يذكر الموجة الداخلية', ax(2).evidence.indexOf('الموجة داخل الأسبوع') >= 0);
  truthy('الدليل يذكر الانتشار بين الأسابيع', ax(2).evidence.indexOf('الانتشار بين الأسابيع') >= 0);
  truthy('الإجمالي 57', R.total === 57);

  eq('محور 4 = 0 (لا تصنيف في النموذج القديم)', ax(4).score, 0);
  eq('محور 6 غير قابل للقياس (لا ورقة مؤشرات)', ax(6).score, null);
  eq('محور 7 غير قابل للقياس (لا ورقة بيانات)', ax(7).score, null);
  eq('التغطية 80%', R.coverage, 80);
  truthy('الدليل يعلن أن الحمل من الشدة وحدها',
    ax(2).evidence.indexOf('الشدة وحدها') >= 0);
  truthy('الدليل يذكر عدد الأيام', ax(3).evidence.indexOf('24') >= 0);
  truthy('المطلوب يذكر الراحة',
    ax(3).required.indexOf('الراحة') >= 0);
}

/* ── 6. الصدق: الغائب لا يُحسب صفراً ── */
head('[6] الصدق في الأرقام');
if (rW.ok) {
  const R = rW.result;
  const nulls = R.axes.filter((a) => a.score === null);
  eq('محوران بلا بيانات', nulls.length, 2);
  eq('قيمتهما null لا صفر', nulls.every((a) => a.weighted === null), true);
  eq('التغطية معلنة', R.coverage, 80);
  const naive = Math.round(R.axes.reduce((s, a) => s + (a.score || 0) * a.weight, 0));
  truthy('الإجمالي المطبَّع أعلى من الحساب الساذج (' + R.total + ' > ' + naive + ')',
    R.total > naive);
}

document.getElementById('out').innerHTML = out.join('');
document.getElementById('sum').innerHTML = (fail === 0)
  ? '<span class="ok">كل الفحوص نجحت — ' + pass + '/' + (pass + fail) + '</span>'
  : '<span class="bad">' + fail + ' فشل</span> · <span class="ok">' + pass + ' نجاح</span>';
</script></body></html>
