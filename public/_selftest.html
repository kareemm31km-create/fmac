<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>FMAC self test</title>
<style>body{background:#08090c;color:#e9ecf1;font:13.5px/1.75 ui-monospace,monospace;padding:20px}
.ok{color:#22c07f}.bad{color:#ff4d59}.warn{color:#ffc233}
h2{font-size:14px;margin:20px 0 6px;color:#5b8def;font-weight:700}
#sum{margin:16px 0;padding:12px 14px;border-radius:12px;background:#0f1115;border:1px solid #23272f;font-size:15px}</style>
</head><body>
<h1 style="font-size:17px">FMAC — فحص ذاتي</h1>
<div id="sum">running…</div>
<div id="out"></div>
<script type="module">
const out = [];
let pass = 0, fail = 0;
const H = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
const head = (t) => out.push('<h2>' + t + '</h2>');
const ok  = (m) => { pass++; out.push('<div class="ok">PASS  ' + m + '</div>'); };
const bad = (m) => { fail++; out.push('<div class="bad">FAIL  ' + m + '</div>'); };
const bad0 = bad;

/* ── 1. تحميل كل وحدة فعلياً — الاستيراد الحقيقي يكشف خطأ التحليل والمسار ── */
head('[1] تحميل الوحدات (import حقيقي)');
const mods = [
  './vendor/firebase-app.js',
  './vendor/firebase-auth.js',
  './vendor/firebase-firestore.js',
  './vendor/firebase-storage.js',
  './js/fmac-config.js',
  './js/fmac-auth.js',
  './js/fmac-firebase.js',
  './js/fmac-payload.js',
  './js/fmac-migrate.js',
  './js/fmac-accounts.js',
  './js/fmac-xlsx.js',
  './js/fmac-monthly.js',
  './js/fmac-monthly-ui.js',
  './js/fmac-router.js',
];
const NS = {};
for (const m of mods) {
  try {
    const ns = await import(m);
    NS[m] = ns;
    ok(m + '   (exports: ' + Object.keys(ns).length + ')');
  } catch (e) {
    bad(m + ' — ' + e.name + ': ' + H(e.message));
  }
}

/* ── 2. الطبقة موجودة وتتصرّف كما يتوقّع index.html ── */
head('[2] عقد طبقة النقل');
const api = window.__fmacApi;
if (typeof api === 'function') ok('window.__fmacApi معرَّفة');
else bad('window.__fmacApi غير معرَّفة');

const shim = NS['./js/fmac-firebase.js'];
if (shim && typeof shim.__fmacApi === 'function') ok('التصدير __fmacApi موجود');
else bad('التصدير __fmacApi مفقود');

const cfg = NS['./js/fmac-config.js'];
const nCol = cfg && cfg.COL ? Object.keys(cfg.COL).length : 0;
if (nCol === 27)
  ok('خريطة المجموعات: ' + nCol + ' مجموعة (المتوقَّع 27)');
else bad('خريطة المجموعات: ' + nCol + ' والمتوقَّع 27');

const authNs = NS['./js/fmac-auth.js'];
if (authNs && authNs.auth && authNs.db && authNs.storage) ok('Auth + Firestore + Storage مهيّأة');
else bad('تهيئة Firebase ناقصة');

const undef = cfg && cfg.COL ? Object.keys(cfg.COL).filter((k) => !cfg.COL[k]) : ['?'];
if (!undef.length) ok('لا اسم مجموعة فارغ');
else bad('مجموعات بلا اسم: ' + undef.join(' · '));
const cw = cfg ? (cfg.COACH_WRITABLE || []) : [];
if (cw.length && cw.every(Boolean)) ok('ما يكتبه المدرب: ' + cw.length + ' مجموعة، كلّها معرَّفة');
else bad('COACH_WRITABLE فيه قيمة فارغة');

/* ── 3. لا طلبات خارجية (القيد §3) ── */
head('[3] لا طلبات خارجية');
for (const m of mods.slice(0, 4)) {
  const t = await (await fetch(m)).text();
  const imports = (t.match(/from"https:/g) || []).length;
  if (imports === 0) ok(m + ' — لا استيراد مطلق');
  else bad(m + ' — استيراد مطلق: ' + imports);
}

/* ── 4. ربط index.html ── */
head('[4] ربط index.html');
const idx = await (await fetch('./index.html')).text();
const checks = [
  ['fetch(API لم يبقَ منها شيء', (idx.match(/fetch\(API/g) || []).length === 0],
  ['__fmacApi(API في 31 موضعاً', (idx.match(/__fmacApi\(API/g) || []).length === 31],
  ['وسم الوحدة موجود', idx.indexOf('js/fmac-firebase.js') >= 0],
  ['الوسيط موجود', idx.indexOf('__fmacResolve') >= 0],
  ['قيمة API الحارسة', idx.indexOf("var API = 'firebase'") >= 0],
  ['لا أثر لعنوان Apps Script', idx.indexOf('script.google.com') < 0],
  ['زر الخروج ينادي Firebase', idx.indexOf('window.__fmacLogout()') >= 0],
  ['قسم الخطط الشهرية موجود', idx.indexOf('monthlyView') >= 0],
  ['وحدة الواجهة الشهرية موصولة', idx.indexOf('fmac-monthly-ui.js') >= 0],
  ['الخطط الشهرية في التنقّل', idx.indexOf("['monthly','") >= 0],
];
for (const [label, good] of checks) { if (good) ok(label); else bad(label); }


/* ── 6. أشكال الحمولة — الخطأ الذي أضاع البيانات ── */
head('[6] مفاتيح تداخل الحمولة');
{
  /* المصدر الوحيد للحقيقة: ما يرسله index.html فعلاً */
  const found = {};
  for (const m of idx.matchAll(/action:'([a-zA-Z]+)'\s*,\s*([a-zA-Z]+)\s*:/g)) {
    if (!found[m[1]]) found[m[1]] = m[2];
  }
  /* ما تتوقّعه الطبقة */
  const NEST = {
    cancel: 'cancel', attendance: 'attend', reply: 'reply', stage: 'stage',
    session: 'session', note: 'note', ack: 'ack', closeweek: 'week',
    result: 'result', shield: 'shield', camp: 'camp',
    natl: 'player', natlDrop: 'player',
    user: 'userRow', userDrop: 'userRow',
    agenda: 'agenda', visit: 'visit', cal: 'cal', calDrop: 'cal',
    targets: 'targets', media: 'media',
  };
  let bad = 0;
  for (const act of Object.keys(found)) {
    const real = found[act], want = NEST[act];
    if (want === undefined) continue;            // إجراء بحمولة مسطّحة
    if (real === want) ok('action:' + act + ' ⇐ ' + real);
    else { bad++; bad0('action:' + act + ' ترسل «' + real + '» والطبقة تقرأ «' + want + '»'); }
  }
  /* حفظ الرصد يُرسل تحت changes */
  const shim = await (await fetch('./js/fmac-firebase.js')).text();
  if (shim.indexOf('body.changes') >= 0) ok('حفظ الرصد يقرأ changes');
  else bad0('حفظ الرصد لا يقرأ changes — سيُبلغ نجاحاً بلا حفظ');
  /* الدروع: أسماء الحقول */
  if (shim.indexOf('nextClub') >= 0) ok('الدروع تحوّل nextClub ⇒ rival');
  else bad0('الدروع لا تحوّل nextClub');
  /* الملفّ كائن لا نصّ */
  if (shim.indexOf('fileOf') >= 0) ok('الملفّ يُقرأ ككائن {name,data}');
  else bad0('الملفّ يُعامَل كنصّ base64');
}
/* ── 5. خادم التطوير (نسخة Node) ── */
head('[5] scripts/dev-server.mjs');
{
  let t = null;
  try {
    const r = await fetch('./_devserver.txt');
    if (r.ok) t = await r.text();
  } catch (e) { /* اختياري */ }
  if (!t || t.indexOf('createServer') < 0) {
    out.push('<div class="warn">SKIP  انسخ scripts/dev-server.mjs إلى ' +
      'public/_devserver.txt لتفعيل هذا الفحص</div>');
  } else {
    try {
      const NL = String.fromCharCode(10);
      const src = t.split(NL).filter((l) => !l.trim().startsWith('import ')).join(NL)
                   .split('import.meta.url').join("'file:///x.mjs'");
      new Function(src);
      ok('يُحلَّل بلا أخطاء (' + t.length + ' bytes)');
    } catch (e) {
      bad('dev-server.mjs — ' + e.name + ': ' + H(e.message));
    }
  }
}


/* ── 7. التوجيه — مسار لكل صفحة ── */
head('[7] التوجيه');
{
  const R = NS['./js/fmac-router.js'];
  if (!R) { bad0('وحدة التوجيه لم تُحمَّل'); }
  else {
    const p = (path) => R.parse(path, '');
    const eqv = (label, got, want) => (got === want)
      ? ok(label + ' = ' + got) : bad0(label + ' — got ' + got + ' want ' + want);

    eqv('/ ⇒ home', p('/').view, 'home');
    eqv('/plan ⇒ plan', p('/plan').view, 'plan');
    eqv('/monthly ⇒ monthly', p('/monthly').view, 'monthly');
    eqv('/sports ⇒ sport', p('/sports').view, 'sport');
    eqv('/archive ⇒ archive', p('/archive').view, 'archive');
    eqv('/settings ⇒ settings', p('/settings').view, 'settings');
    eqv('مسار مجهول ⇒ home', p('/nope').view, 'home');
    eqv('اللعبة من المسار', p('/sports/judo').sport, 'الجودو');
    eqv('تبويب التقارير', p('/reports/week').tab, 'week');

    eqv('home ⇒ /', R.build('home', {}, ''), '/');
    eqv('plan ⇒ /plan', R.build('plan', {}, ''), '/plan');
    eqv('لعبة ⇒ /sports/judo', R.build('sport', { sport: 'الجودو' }, ''), '/sports/judo');
    eqv('تبويب ⇒ /reports/week', R.build('reports', { tab: 'week' }, ''), '/reports/week');
    eqv('التبويب الافتراضي لا يظهر', R.build('reports', { tab: 'month' }, ''), '/reports');

    /* ذهاب وعودة لكل صفحة */
    let rt = 0;
    for (const r of R.ROUTES) {
      if (p(R.build(r.view, {}, '')).view === r.view) rt++;
    }
    if (rt === R.ROUTES.length) ok('ذهاب وعودة لكل الصفحات (' + rt + ')');
    else bad0('ذهاب وعودة فشل في ' + (R.ROUTES.length - rt) + ' صفحة');

    /* كل صفحة في VIEWS لها مسار */
    const views = (idx.match(/const VIEWS=\{[\s\S]*?\};/) || [''])[0];
    const missing = R.ROUTES.filter((r) => views.indexOf(r.view + ':') < 0);
    if (!missing.length) ok('كل مسار يقابل صفحة موجودة');
    else bad0('مسارات بلا صفحة: ' + missing.map((m) => m.view).join(' · '));

    if (idx.indexOf('__fmacRouter.push') >= 0) ok('setView يحدّث المسار');
    else bad0('setView لا يحدّث المسار');
    if (idx.indexOf("addEventListener('popstate'") >= 0) ok('زرّ الرجوع متابَع');
    else bad0('زرّ الرجوع غير متابَع');
    if (idx.indexOf('window.__fmacRouter.push') >= 0) ok('window.history صراحةً (§9)');
    else bad0('قد يُحجب history المحلّي');
  }
}
document.getElementById('out').innerHTML = out.join('');
const el = document.getElementById('sum');
el.innerHTML = (fail === 0)
  ? '<span class="ok">كل الفحوص نجحت — ' + pass + '/' + (pass + fail) + '</span>'
  : '<span class="bad">' + fail + ' فشل</span> · <span class="ok">' + pass + ' نجاح</span>';
</script></body></html>
