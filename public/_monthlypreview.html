<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FMAC monthly preview</title>
<style>
:root{--brand:#e8555c;--surface:#0f1115;--surface-soft:#191d24;--line:#23272f;--steel:#9aa3b0}
body{background:#08090c;color:#e9ecf1;
  font:14px/1.7 Tajawal,'Segoe UI',system-ui,sans-serif;
  padding:24px;max-width:1080px;margin:0 auto;direction:rtl}
h1{font-size:20px;margin:0 0 4px}
.note{color:var(--steel);font-size:12.5px;margin:0 0 18px}
</style></head><body>
<h1>الخطط الشهرية — معاينة</h1>
<p class="note">صفحة معاينة بلا تسجيل دخول: بيانات تجريبية وواجهة برمجية وهمية،
لفحص الشكل والسلوك. لا تكتب شيئاً في Firestore.</p>
<div id="host"></div>

<script type="module">
import * as UI from './js/fmac-monthly-ui.js?v=2';
import * as M from './js/fmac-monthly.js?v=5';
import { readXlsx } from './js/fmac-xlsx.js?v=5';

/* تقييم حقيقي لنموذجين محفوظين — لا أرقام مكتوبة يدوياً */
async function evalFixture(name) {
  const buf = await (await fetch('./_fixtures/' + name + '?v=2')).arrayBuffer();
  const r = await M.evaluateFile(buf, readXlsx);
  return r.ok ? r.result : null;
}
const full = await evalFixture('plan-full.xlsx');
const thin = await evalFixture('plan-thin.xlsx');

const monthly = [
  { k: 'c1__2026-09', month: '2026-09', sport: 'الجودو', branch: 'الفجيرة',
    coach: 'c1', coachName: 'مدرب الجودو', url: '',
    uploadedAt: '2026-08-29T09:00:00Z' },
  { k: 'c2__2026-09', month: '2026-09', sport: 'الكاراتيه', branch: 'دبا',
    coach: 'c2', coachName: 'مدرب الكاراتيه', url: '',
    uploadedAt: '2026-09-03T09:00:00Z' },
];
const reviews = { 'c1__2026-09': full, 'c2__2026-09': thin };

/* واجهة برمجية وهمية — تُظهر الحمولة بدل أن تكتبها */
const api = async (url, opts) => {
  const body = JSON.parse(opts.body);
  console.log('MOCK SAVE:', body);
  const info = document.createElement('pre');
  info.style.cssText = 'background:#0f1115;border:1px solid #23272f;border-radius:12px;' +
    'padding:14px;font:12px ui-monospace,monospace;overflow:auto;max-height:260px;' +
    'direction:ltr;text-align:left;color:#9aa3b0;margin-top:14px';
  const shown = JSON.parse(JSON.stringify(body));
  shown.file = shown.file ? '<' + shown.file.length + ' حرفاً base64>' : '';
  info.textContent = 'الحمولة التي كانت ستُرسل:\n' + JSON.stringify(shown, null, 2);
  document.getElementById('host').appendChild(info);
  return { ok: true, json: async () => ({ ok: true, k: 'preview' }) };
};

UI.render(document.getElementById('host'), {
  user: { name: 'كريم زاهر', admin: true, code: 'admin1', sport: '', branch: '' },
  monthly, reviews, api,
  onSaved: () => console.log('saved (preview)'),
});
</script></body></html>
